{% extends 'base.html' %}
{% block title %}Chat{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-8">
    <div id="messages" style="height:60vh; overflow:auto; border:1px solid #ccc; padding:10px;">
    </div>

    <form id="msgForm" class="mt-2">
      <div class="input-group">
        <input id="messageInput" class="form-control" placeholder="Type a message...">
        <button class="btn btn-primary" type="submit">Send</button>
      </div>
    </form>
  </div>
  <div class="col-md-4">
    <h5>Users</h5>
    <ul id="users" class="list-group"></ul>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const username = {{ username|tojson }};
  const socket = io({transports: ['websocket']});

  socket.on('connect', () => {
    console.log('connected');
  });

  socket.on('message', data => {
    const el = document.createElement('div');
    el.innerHTML = `<strong>${data.user}</strong>: ${data.msg}`;
    document.getElementById('messages').appendChild(el);
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  });

  socket.on('status', data => {
    const el = document.createElement('div');
    el.innerHTML = `<em>${data.msg}</em>`;
    document.getElementById('messages').appendChild(el);
  });

  document.getElementById('msgForm').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('messageInput');
    const msg = input.value.trim();
    if (!msg) return;
    socket.emit('message', {msg});
    input.value = '';
  });
</script>

{% endblock %}
